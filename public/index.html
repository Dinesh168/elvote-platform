<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- spec flow-fixes O2: viewport-fit=cover gives env(safe-area-inset-*) so the bottom menu clears the home bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ElVote</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      /* The visible height on phones: 100% can run under the browser's bottom toolbar, hiding the menu. */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
